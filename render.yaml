services:
  - type: web
    name: siena-reservations
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: APP_NAME
        value: Siena Reservations
      - key: ADMIN_PIN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: /var/data/reservations.db
      - key: OPEN_HOUR
        value: "16"
      - key: CLOSE_HOUR
        value: "22"
      - key: SLOT_MINUTES
        value: "30"
      - key: TURN_MINUTES
        value: "90"
      - key: PUBLIC_BASE_URL
        value: https://siena-reservations.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Siena Restaurant and Bar
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMS_ENABLED
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SMS_REMINDER_24H
        value: "true"
      - key: SMS_REMINDER_2H
        value: "true"
      - key: CRON_SECRET
        generateValue: true
    disk:
      name: reservation-data
      mountPath: /var/data
      sizeGB: 1

  - type: cron
    name: siena-sms-reminders
    runtime: image
    image:
      url: curlimages/curl:8.10.1
    schedule: "*/15 * * * *"
    dockerCommand: sh -c 'curl -fsS "$REMINDER_URL?secret=$CRON_SECRET"'
    envVars:
      - key: REMINDER_URL
        value: https://siena-reservations.onrender.com/tasks/send-sms-reminders
      - key: CRON_SECRET
        sync: false
