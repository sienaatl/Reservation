<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://sienaatl.com">
      <img class="brand-logo" src="{{ url_for('static', filename='siena-logo.png') }}" alt="Siena Restaurant and Bar">
    </a>
    <nav class="topnav">
      {% if session.get('staff_user_id') %}
      <a href="{{ url_for('manager_overview') }}">Manager</a>
      <a href="{{ url_for('floorplan') }}">Floor Plan</a>
      <a href="{{ url_for('timeline') }}">Timeline</a>
      <a href="{{ url_for('admin') }}">Reservations</a>
      <a href="{{ url_for('waitlist_page') }}">Waitlist</a>
      <a href="{{ url_for('servers_page') }}">Servers</a>
      <a href="{{ url_for('guests_page') }}">Guests</a>
      <a href="{{ url_for('support_page') }}" id="nav-support-link">Support{% if open_support_tickets %} <span class="nav-badge" id="nav-support-badge">{{ open_support_tickets }}</span>{% endif %}</a>
      {% endif %}
    {% if session.get('staff_user_id') %}<a href="{{ url_for('settings_page') }}">Settings</a><a href="{{ url_for('audit_page') }}">Audit</a><form method="post" action="{{ url_for('staff_logout') }}" style="display:inline"><button class="nav-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button></form>{% endif %}</nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    function togglePasswordVisibility(btn) {
      const input = btn.previousElementSibling;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '👁' : '🙈';
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    }
  </script>
</body>
</html>
